name: Cyclotomic triad audit
on:
  pull_request:
    paths:
      - 'crt_codes/**'
      - '.github/workflows/triad-audit.yml'
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference dependencies
        run: python -m pip install --upgrade sympy pytest
      - name: Pure-Python exhaustive reference tests
        run: python -m pytest crt_codes/test_exhaustive.py -q
      - name: Three-message reference audit
        run: python -m crt_codes.triad_audit --trials 3 --skip-lattice --output triad-reference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triad-reference
          path: triad-reference.json
          if-no-files-found: ignore

  lattice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full decoding dependencies
        run: python -m pip install --upgrade sympy pytest fpylll cysignals
      - name: Three-message lattice-vs-reference audit
        run: python -m crt_codes.triad_audit --trials 3 --output triad-full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triad-full
          path: triad-full.json
          if-no-files-found: ignore
