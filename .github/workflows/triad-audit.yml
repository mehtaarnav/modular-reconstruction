name: PR #2 Trial-0 scalar affine comparator
on:
  pull_request:
    paths:
      - 'crt_codes/scalar_affine_trial0.py'
      - '.github/workflows/triad-audit.yml'
  workflow_dispatch:

jobs:
  scalar-affine-existing-trial0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies from certified PR 2 trial
        run: python -m pip install "sympy==1.14.0" "pytest==9.2.0" "fpylll==0.6.4" "cysignals==1.12.5"
      - name: 11D scalar comparator on same Trial-0 word and Galois comparison
        run: python -m crt_codes.scalar_affine_trial0 --output scalar-affine-trial0.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2-trial0-scalar-affine-comparison
          path: scalar-affine-trial0.json
          if-no-files-found: ignore
