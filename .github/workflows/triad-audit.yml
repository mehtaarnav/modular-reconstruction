name: PR #2 single-run parameter and timing audit
on:
  pull_request:
    paths:
      - 'crt_codes/**'
      - '.github/workflows/triad-audit.yml'
  workflow_dispatch:

jobs:
  instrumented-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact pinned major dependencies
        run: python -m pip install "sympy==1.14.0" "pytest==9.2.0" "fpylll==0.6.4" "cysignals==1.12.5"
      - name: Reference-decoder regression tests
        run: python -m pytest crt_codes/test_exhaustive.py -q
      - name: One fully instrumented reproduction, existing trial zero
        run: python -m crt_codes.triad_audit --trials 1 --seed 20261121 --instrument --output triad-instrumented.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triad-one-instrumented
          path: triad-instrumented.json
          if-no-files-found: ignore
