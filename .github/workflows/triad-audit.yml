name: PR #2 Trial-0 exact Stage B certificate
on:
  pull_request:
    paths:
      - 'crt_codes/integer_affine.py'
      - 'crt_codes/stage_b_certificate.py'
      - 'crt_codes/test_integer_affine.py'
      - '.github/workflows/triad-audit.yml'
  workflow_dispatch:

jobs:
  stage-b-single-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin exact dependencies from prior PR #2 audit
        run: python -m pip install "sympy==1.14.0" "pytest==9.2.0" "fpylll==0.6.4" "cysignals==1.12.5"
      - name: Exact arithmetic unit tests (not new received-word trials)
        run: python -m pytest crt_codes/test_integer_affine.py crt_codes/test_exhaustive.py -q
      - name: One exact Stage B certificate on the existing Trial-0 received word
        run: python -m crt_codes.stage_b_certificate --output stage-b-certificate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2-trial0-stage-b-exact-certificate
          path: stage-b-certificate.json
          if-no-files-found: ignore
